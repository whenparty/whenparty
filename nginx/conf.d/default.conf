# Settings shared by every site on this proxy, plus the plain-HTTP catch-all.
# Site configs in this directory only add what differs: certificate, CSP, upstream.

# Rate limiting
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_req zone=general burst=30 nodelay;
limit_conn conn_limit 15;

# Real client IP from Cloudflare. The trusted ranges live in cloudflare_real_ip.conf,
# which scripts/update-cloudflare-real-ip.sh generates on the VPS.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Docker's embedded DNS: upstreams marked "resolve" are looked up at runtime,
# so a stopped container never blocks nginx from starting or reloading.
resolver 127.0.0.11 ipv6=off valid=30s;

server_tokens off;
http2 on;

# Response hardening for every response. A server's own add_header lines
# (e.g. its Content-Security-Policy) are merged in instead of replacing these.
add_header_inherit merge;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Proxy defaults, including WebSocket upgrades. An empty Connection header
# keeps upstream keepalive connections usable.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_redirect off;
proxy_read_timeout 90s;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;

    location = /health {
        default_type text/plain;
        return 200 'OK';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
