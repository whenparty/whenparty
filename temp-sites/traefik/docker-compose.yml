name: traefik-tempsites

services:
  traefik:
    image: traefik:v3.5.4
    container_name: traefik-tempsites
    restart: unless-stopped

    # Dashboard on the VPS loopback only. Reach it through an SSH tunnel:
    #   ssh -L 8080:127.0.0.1:18080 <user>@<vps>  →  http://localhost:8080/dashboard/
    ports:
      - "127.0.0.1:18080:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro

    networks:
      - wp_tempsites

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      - "traefik.http.routers.dashboard.entrypoints=traefik"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      # user:hash from the deploy workflow (written to .env on the VPS)
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:-}"

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  wp_tempsites:
    external: true
