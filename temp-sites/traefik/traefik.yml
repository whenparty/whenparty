providers:
  docker:
    exposedByDefault: false
    network: wp_tempsites

entryPoints:
  web:
    address: ":8000"
    forwardedHeaders:
      trustedIPs:
        - 172.16.0.0/12 # All Docker networks

api:
  dashboard: true
  insecure: false

ping: {}

# Logs go to stdout (docker logs). nginx already logs every request, so no access log here.
log:
  level: INFO
