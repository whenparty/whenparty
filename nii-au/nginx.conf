# Serves html/. scripts/fingerprint.sh gives assets content-hashed names during
# the image build, so those are cached for a year; everything else (index.html,
# favicon.svg) is revalidated on every visit.
server {
    # IPv6 too: busybox wget in the healthcheck resolves localhost to ::1 first.
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        add_header Cache-Control "no-cache";
    }

    location ~ "\.[0-9a-f]{10}\.(css|js|mp4|webp|png)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
