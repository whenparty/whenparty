name: Deploy nii.au Site

on:
  push:
    branches: [main]
    paths:
      - "nii-au/**"
      - "!nii-au/**/*.md"
      - ".github/workflows/nii-au.yml"
      - ".github/workflows/site.yml"

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  site:
    uses: ./.github/workflows/site.yml
    with:
      site: nii-au
    secrets: inherit
