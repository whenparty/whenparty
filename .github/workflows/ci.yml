name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      games-workflows: ${{ steps.changes.outputs.games-workflows }}
      turn: ${{ steps.changes.outputs.turn }}
      nginx: ${{ steps.changes.outputs.nginx }}
      project-names: ${{ steps.changes.outputs.project-names }}
      game-names: ${{ steps.changes.outputs.game-names }}
      markdown: ${{ steps.changes.outputs.markdown }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          base=HEAD^1
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          fi

          code=$(git diff --name-only "$base" HEAD -- ':!*.md')

          touched() {
            grep -qE "$1" <<< "$code"
          }

          workflow_touched() {
            touched "^\.github/workflows/(ci|$1)\.yml$"
          }

          games_workflows=false
          if workflow_touched 'check-games|games|games-changes'; then
            games_workflows=true
          fi

          turn=false
          if touched '^games/platform/turn/' || workflow_touched 'check-turn|games'; then
            turn=true
          fi

          nginx=false
          if touched '^infra/' || workflow_touched 'check-nginx|infra'; then
            nginx=true
          fi

          project_names=false
          if touched '^(games|temp-sites/projects)/' || workflow_touched 'check-project-names|games'; then
            project_names=true
          fi

          game_names=false
          if touched '(^|/)(docker-)?compose\.ya?ml$|^infra/nginx/conf\.d/games\.conf$' || workflow_touched 'check-game-names'; then
            game_names=true
          fi

          markdown=$(git diff -z --name-only --diff-filter=d "$base" HEAD -- '*.md' |
            jq -Rsc 'split("\u0000") | map(select(length > 0))')

          {
            echo "games-workflows=$games_workflows"
            echo "turn=$turn"
            echo "nginx=$nginx"
            echo "project-names=$project_names"
            echo "game-names=$game_names"
            echo "markdown=$markdown"
          } | tee -a "$GITHUB_OUTPUT"

  games-changes:
    uses: ./.github/workflows/games-changes.yml

  games:
    needs: [changes, games-changes]
    if: needs.changes.outputs.games-workflows == 'true' || needs.games-changes.outputs.packages != ''
    uses: ./.github/workflows/check-games.yml
    with:
      packages: ${{ needs.changes.outputs.games-workflows == 'true' && 'all' || needs.games-changes.outputs.packages }}

  turn:
    needs: changes
    if: needs.changes.outputs.turn == 'true'
    uses: ./.github/workflows/check-turn.yml

  nginx:
    needs: changes
    if: needs.changes.outputs.nginx == 'true'
    uses: ./.github/workflows/check-nginx.yml

  project-names:
    needs: changes
    if: needs.changes.outputs.project-names == 'true'
    uses: ./.github/workflows/check-project-names.yml

  game-names:
    needs: changes
    if: needs.changes.outputs.game-names == 'true'
    uses: ./.github/workflows/check-game-names.yml

  words:
    needs: changes
    if: needs.changes.outputs.markdown != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the word limit
        env:
          FILES: ${{ needs.changes.outputs.markdown }}
        run: |
          set -euo pipefail
          limit=$(sed -n 's/.*at most \([0-9][0-9]*\) words.*/\1/p' docs/conventions/writing.md | head -n 1)
          if [ -z "$limit" ]; then
            echo "::error file=docs/conventions/writing.md::No 'at most N words' in docs/conventions/writing.md"
            exit 1
          fi
          status=0
          while IFS= read -r file; do
            words=$(LC_ALL=C awk '/^ *```mermaid *$/ { m = 1; k = 0; next } m && /^ *```/ { m = 0; next } m { k += NF; next } { n += NF } END { print n + m * (k + 1) }' "$file")
            if [ "$words" -gt "$limit" ]; then
              echo "::error file=$file::$file has $words words. A Markdown document has at most $limit words, as docs/conventions/writing.md says."
              status=1
            fi
          done < <(jq -r '.[]' <<< "$FILES")
          exit "$status"

  result:
    needs: [changes, games-changes, games, turn, nginx, project-names, game-names, words]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a check failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
