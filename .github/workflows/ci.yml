name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      games-workflows: ${{ steps.changes.outputs.games-workflows }}
      turn: ${{ steps.changes.outputs.turn }}
      nginx: ${{ steps.changes.outputs.nginx }}
      project-names: ${{ steps.changes.outputs.project-names }}
      game-names: ${{ steps.changes.outputs.game-names }}
      www: ${{ steps.changes.outputs.www }}
      blog: ${{ steps.changes.outputs.blog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          base=HEAD^1
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          fi

          code=$(git diff --name-only "$base" HEAD -- ':!*.md')

          touched() {
            grep -qE "$1" <<< "$code"
          }

          workflow_touched() {
            touched "^\.github/workflows/(ci|$1)\.yml$"
          }

          games_workflows=false
          if workflow_touched 'check-games|games|games-changes'; then
            games_workflows=true
          fi

          turn=false
          if touched '^games/platform/turn/' || workflow_touched 'check-turn|games'; then
            turn=true
          fi

          nginx=false
          if touched '^infra/' || workflow_touched 'check-nginx|infra'; then
            nginx=true
          fi

          project_names=false
          if touched '^(games|temp-sites/projects)/' || workflow_touched 'check-project-names|games'; then
            project_names=true
          fi

          game_names=false
          if touched '(^|/)(docker-)?compose\.ya?ml$|^infra/nginx/conf\.d/games\.conf$' || workflow_touched 'check-game-names'; then
            game_names=true
          fi

          www=false
          if touched '^www/' || workflow_touched 'check-www'; then
            www=true
          fi

          blog=false
          if touched '^blog/' || workflow_touched 'check-blog' || git diff --name-only "$base" HEAD -- 'blog/src/posts/' | grep -q .; then
            blog=true
          fi

          {
            echo "games-workflows=$games_workflows"
            echo "turn=$turn"
            echo "nginx=$nginx"
            echo "project-names=$project_names"
            echo "game-names=$game_names"
            echo "www=$www"
            echo "blog=$blog"
          } | tee -a "$GITHUB_OUTPUT"

  games-changes:
    uses: ./.github/workflows/games-changes.yml

  games:
    needs: [changes, games-changes]
    if: needs.changes.outputs.games-workflows == 'true' || needs.games-changes.outputs.packages != ''
    uses: ./.github/workflows/check-games.yml
    with:
      packages: ${{ needs.changes.outputs.games-workflows == 'true' && 'all' || needs.games-changes.outputs.packages }}
      deployments: ${{ needs.changes.outputs.games-workflows == 'true' && 'all' || needs.games-changes.outputs.deployments }}

  turn:
    needs: changes
    if: needs.changes.outputs.turn == 'true'
    uses: ./.github/workflows/check-turn.yml

  nginx:
    needs: changes
    if: needs.changes.outputs.nginx == 'true'
    uses: ./.github/workflows/check-nginx.yml

  project-names:
    needs: changes
    if: needs.changes.outputs.project-names == 'true'
    uses: ./.github/workflows/check-project-names.yml

  game-names:
    needs: changes
    if: needs.changes.outputs.game-names == 'true'
    uses: ./.github/workflows/check-game-names.yml

  www:
    needs: changes
    if: needs.changes.outputs.www == 'true'
    uses: ./.github/workflows/check-www.yml

  blog:
    needs: changes
    if: needs.changes.outputs.blog == 'true'
    uses: ./.github/workflows/check-blog.yml

  docs:
    uses: ./.github/workflows/check-docs.yml

  format:
    uses: ./.github/workflows/check-format.yml

  result:
    needs: [changes, games-changes, games, turn, nginx, project-names, game-names, www, blog, docs, format]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fail when a check failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
