name: Deploy Temp Sites

on:
  push:
    branches: [main]
    paths:
      - 'temp-sites/projects/**'
      - '!temp-sites/**/*.md'
      - '.github/workflows/temp-sites.yml'
      - '.github/workflows/deploy-project.yml'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.changes.outputs.projects }}
      has_project_changes: ${{ steps.changes.outputs.has_project_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect project changes
        id: changes
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # The monorepo has several root commits, so diff against the empty tree instead
            BASE_SHA=$(git hash-object -t tree /dev/null)
          fi

          changed_files=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" -- temp-sites/projects/ ':!*.md' || true)

          if [ -z "$changed_files" ]; then
            {
              echo "projects=[]"
              echo "has_project_changes=false"
            } >> "$GITHUB_OUTPUT"
            echo "No project changes detected"
            exit 0
          fi

          projects=$(echo "$changed_files" | awk -F/ '{if ($1 == "temp-sites" && $2 == "projects" && $3 != "") print $3}' | sort -u | jq -R . | jq -s -c .)
          {
            echo "projects=$projects"
            echo "has_project_changes=true"
          } >> "$GITHUB_OUTPUT"
          echo "Changed projects: $projects"

  build-and-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_project_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.projects) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-project.yml
    with:
      path: temp-sites/projects/${{ matrix.project }}
      image: ${{ matrix.project }}
    secrets: inherit
