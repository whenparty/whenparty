name: Deploy Traefik Router

on:
  push:
    branches: [main]
    paths:
      - 'temp-sites/traefik/**'
      - '!temp-sites/traefik/**/*.md'
      - '.github/workflows/traefik.yml'
  workflow_dispatch:

env:
  TRAEFIK_DIR: /opt/services/whenparty/tempsites/traefik

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate dashboard auth hash
        id: auth
        env:
          DASHBOARD_USER: ${{ secrets.TRAEFIK_DASHBOARD_USER }}
          DASHBOARD_PASSWORD: ${{ secrets.TRAEFIK_DASHBOARD_PASSWORD }}
        run: |
          set -euo pipefail
          hash="$DASHBOARD_USER:$(openssl passwd -apr1 "$DASHBOARD_PASSWORD")"
          # docker compose treats $ in .env values as interpolation, so escape it as $$
          escaped=${hash//\$/\$\$}
          echo "::add-mask::$escaped"
          echo "hash=$escaped" >> "$GITHUB_OUTPUT"

      - name: Create deployment directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: mkdir -p "${{ env.TRAEFIK_DIR }}"

      - name: Copy Traefik files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          source: "temp-sites/traefik/docker-compose.yml,temp-sites/traefik/traefik.yml"
          target: ${{ env.TRAEFIK_DIR }}
          overwrite: true
          strip_components: 2

      - name: Deploy Traefik to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DASHBOARD_AUTH_HASH: ${{ steps.auth.outputs.hash }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          envs: DASHBOARD_AUTH_HASH
          script: |
            set -euo pipefail

            cd "${{ env.TRAEFIK_DIR }}"

            printf 'TRAEFIK_DASHBOARD_AUTH=%s\n' "$DASHBOARD_AUTH_HASH" > .env
            chmod 600 .env

            docker network inspect wp_tempsites >/dev/null 2>&1 || docker network create wp_tempsites
            docker compose pull
            # traefik.yml is bind-mounted, so recreate to pick up static config changes
            docker compose up -d --force-recreate --remove-orphans

            # The dashboard must answer on the loopback port and ask for credentials
            code=000
            for _ in $(seq 1 15); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/dashboard/ || true)
              [ "$code" = "401" ] && break
              sleep 2
            done
            echo "Dashboard on 127.0.0.1:18080 answered HTTP $code (expected 401)"
            [ "$code" = "401" ]
