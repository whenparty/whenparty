name: Deploy When Party Blog

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - '!blog/**/*.md'
      - 'blog/src/posts/**'
      - '.github/workflows/blog.yml'
      - '.github/workflows/site.yml'

permissions:
  contents: read
  packages: write

jobs:
  site:
    uses: ./.github/workflows/site.yml
    with:
      site: blog
    secrets: inherit
