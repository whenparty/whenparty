name: Deploy Games

on:
  push:
    branches: [main]
    paths:
      - 'games/**'
      - '!games/**/*.md'
      - '.github/workflows/games.yml'
      - '.github/workflows/deploy-project.yml'
  workflow_dispatch:

jobs:
  check:
    uses: ./.github/workflows/check-games.yml

  turn:
    uses: ./.github/workflows/check-turn.yml

  project-names:
    uses: ./.github/workflows/check-project-names.yml

  changes:
    uses: ./.github/workflows/games-changes.yml

  images:
    needs: [check, turn, project-names, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digests: ${{ steps.push.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start the images of the deployments
        id: build
        env:
          DEPLOYMENTS: ${{ needs.changes.outputs.deployments }}
        run: |
          set -euo pipefail
          reached=()
          while read -r folder; do
            if [ -f "$folder/Dockerfile" ]; then
              reached+=("$folder")
            fi
          done < <(jq -r '.[].path' <<< "$DEPLOYMENTS")
          if [ "${#reached[@]}" -gt 0 ]; then
            mapfile -t all < <(
              git ls-tree -r --name-only HEAD -- games |
                grep -E '^games/([^/]+/)?[^/]+/Dockerfile$' |
                sed 's#/Dockerfile$##'
            )
            sh .github/scripts/build-images.sh "${all[@]}"
            echo "all=${all[*]}" | tee -a "$GITHUB_OUTPUT"
          fi
          echo "folders=${reached[*]}" | tee -a "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.build.outputs.folders != ''
        with:
          package_json_file: games/package.json
          standalone: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.build.outputs.folders != ''
        with:
          node-version: 26.13.1

      - name: Run the end-to-end tests on the images
        if: steps.build.outputs.folders != ''
        env:
          FOLDERS: ${{ steps.build.outputs.all }}
        run: |
          set -euo pipefail
          pnpm --dir games install --frozen-lockfile
          images=()
          for folder in $FOLDERS; do
            images+=("$folder=whenparty-games/$(basename "$folder")")
          done
          sh games/tests/e2e.sh "${images[@]}"

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: games-e2e-tests
          path: |
            games/playwright-report/
            games/test-results/

      - name: Login to GHCR
        if: steps.build.outputs.folders != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the images
        id: push
        env:
          FOLDERS: ${{ steps.build.outputs.folders }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          digests='{}'
          for folder in $FOLDERS; do
            name=$(basename "$folder")
            image="$REGISTRY/$name:sha-$SHA"
            docker tag "whenparty-games/$name" "$image"
            docker push --quiet "$image"
            digest=$(docker inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$image" | grep -m1 "^$REGISTRY/$name@")
            digests=$(jq -c --arg path "$folder" --arg digest "$digest" '. + {($path): $digest}' <<< "$digests")
          done
          echo "digests=$digests" | tee -a "$GITHUB_OUTPUT"

  deploy:
    needs: [changes, images]
    if: needs.changes.outputs.deployments != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.changes.outputs.deployments) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-project.yml
    with:
      path: ${{ matrix.project.path }}
      image: ${{ matrix.project.image }}
      image-ref: ${{ fromJson(needs.images.outputs.digests)[matrix.project.path] || '' }}
    secrets: inherit

  smoke:
    needs: [changes, deploy]
    if: ${{ !cancelled() && needs.deploy.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the deployments on the live site
        env:
          DEPLOYMENTS: ${{ needs.changes.outputs.deployments }}
        run: |
          mapfile -t folders < <(jq -r '.[].path' <<< "$DEPLOYMENTS")
          python3 -I .github/scripts/smoke-games.py "${folders[@]}"
