name: Deploy Games

on:
  push:
    branches: [main]
    paths:
      - 'games/**'
      - '!games/**/*.md'
      - '.github/workflows/games.yml'
      - '.github/workflows/deploy-project.yml'
  workflow_dispatch:

jobs:
  check:
    uses: ./.github/workflows/check-games.yml

  turn:
    uses: ./.github/workflows/check-turn.yml

  project-names:
    uses: ./.github/workflows/check-project-names.yml

  changes:
    uses: ./.github/workflows/games-changes.yml

  deploy:
    needs: [check, turn, project-names, changes]
    if: needs.changes.outputs.deployments != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.changes.outputs.deployments) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-project.yml
    with:
      path: ${{ matrix.project.path }}
      image: ${{ matrix.project.image }}
      context: games
    secrets: inherit
