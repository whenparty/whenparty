name: Deploy nii.au Site

on:
  push:
    branches: [main]
    paths:
      - "nii/**"
      - "!nii/**/*.md"
      - ".github/workflows/nii.yml"
      - ".github/workflows/site.yml"

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  site:
    uses: ./.github/workflows/site.yml
    with:
      site: nii
    secrets: inherit
