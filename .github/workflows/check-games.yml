name: Check Games

on:
  workflow_call:
    inputs:
      packages:
        description: all, or the package folders under games/ to test and typecheck
        required: false
        type: string
        default: all

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test and typecheck
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          docker run --rm -e PACKAGES -v "$PWD/games:/games" -w /games node:24.22.0-alpine3.24 sh -c '
            set -euf
            corepack enable
            pnpm install --frozen-lockfile
            if [ "$PACKAGES" = all ]; then
              pnpm test
              pnpm typecheck
            else
              set --
              for package in $PACKAGES; do
                set -- "$@" --filter "{./$package}"
              done
              pnpm "$@" test
              pnpm "$@" --if-present typecheck
            fi
          '

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: games/package.json
          standalone: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0

      - name: Run the browser tests
        working-directory: games
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euf
          pnpm install --frozen-lockfile
          set --
          if [ "$PACKAGES" != all ]; then
            set -- $PACKAGES
          fi
          sh tests/browser.sh --pass-with-no-tests "$@"

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: games-browser-tests
          path: |
            games/playwright-report/
            games/test-results/
