name: Check Games

on:
  workflow_call:
    inputs:
      packages:
        description: all, or the package folders under games/ to test and typecheck
        required: false
        type: string
        default: all
      deployments:
        description: all, or a JSON list of the deployments of games/ whose images to build, each as {path, image}
        required: false
        type: string
        default: '[]'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add pnpm to the Node image
        run: |
          docker build -t games-check - <<'EOF'
          FROM node:26.13.1-alpine3.24
          COPY --from=ghcr.io/pnpm/pnpm:12.21.0-alpine /opt/pnpm /opt/pnpm
          RUN ln -s /opt/pnpm/pnpm /usr/local/bin/pnpm
          EOF

      - name: Test and typecheck
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          docker run --rm -e PACKAGES -v "$PWD/games:/games" -w /games games-check sh -c '
            set -euf
            pnpm install --frozen-lockfile
            if [ "$PACKAGES" = all ]; then
              pnpm test
              pnpm typecheck
            else
              set --
              for package in $PACKAGES; do
                set -- "$@" --filter "{./$package}"
              done
              pnpm "$@" test
              pnpm "$@" --if-present typecheck
            fi
          '

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start the images of the deployments
        env:
          DEPLOYMENTS: ${{ inputs.deployments }}
        run: |
          set -euo pipefail
          if [ "$DEPLOYMENTS" = all ]; then
            folders=$(
              git ls-tree -r --name-only HEAD -- games |
                { grep -E '^games/([^/]+/)?[^/]+/compose\.yml$' || true; } |
                sed 's#/compose\.yml$##'
            )
          else
            folders=$(jq -r '.[].path' <<< "$DEPLOYMENTS")
          fi
          for folder in $folders; do
            if [ -f "$folder/Dockerfile" ]; then
              echo "::group::$folder"
              image="games-check-$(basename "$folder")"
              docker build -t "$image" -f "$folder/Dockerfile" games
              container=$(docker run -d --health-interval 1s "$image")
              state=
              for _ in $(seq 30); do
                state=$(docker inspect -f '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}without a health check{{end}}' "$container")
                [ "$state" = 'running starting' ] || break
                sleep 1
              done
              if [ "$state" != 'running healthy' ]; then
                docker logs "$container"
                case $state in
                  *'without a health check') echo "::error::$folder: the image has no health check" ;;
                  *) echo "::error::$folder: the container did not pass its health check within 30 seconds ($state)" ;;
                esac
                exit 1
              fi
              docker rm -f "$container" > /dev/null
              echo "::endgroup::"
            fi
          done

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: games/package.json
          standalone: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1

      - name: Run the browser tests
        working-directory: games
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euf
          pnpm install --frozen-lockfile
          set --
          if [ "$PACKAGES" != all ]; then
            set -- $PACKAGES
          fi
          sh tests/browser.sh --pass-with-no-tests "$@"

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: games-browser-tests
          path: |
            games/playwright-report/
            games/test-results/
