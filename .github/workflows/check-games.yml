name: Check Games

on:
  workflow_call:
    inputs:
      packages:
        description: all, or the package folders under games/ to test and typecheck
        required: false
        type: string
        default: all

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add pnpm to the Node image
        run: |
          docker build -t games-check - <<'EOF'
          FROM node:26.13.1-alpine3.24
          COPY --from=ghcr.io/pnpm/pnpm:12.21.0-alpine /opt/pnpm /opt/pnpm
          RUN ln -s /opt/pnpm/pnpm /usr/local/bin/pnpm
          EOF

      - name: Test and typecheck
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          docker run --rm -e PACKAGES -v "$PWD/games:/games" -w /games games-check sh -c '
            set -euf
            pnpm install --frozen-lockfile
            if [ "$PACKAGES" = all ]; then
              pnpm test
              pnpm typecheck
            else
              set --
              for package in $PACKAGES; do
                set -- "$@" --filter "{./$package}"
              done
              pnpm "$@" test
              pnpm "$@" --if-present typecheck
            fi
          '
