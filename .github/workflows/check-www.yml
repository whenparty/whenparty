name: Check www

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the page
        run: www/tests/run.sh

      - name: Upload the report and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: www-tests
          path: |
            www/playwright-report/
            www/test-results/

      - name: Take the new screenshots
        id: snapshots
        if: failure()
        run: www/tests/run.sh --update-snapshots=all

      - name: Upload the new screenshots
        if: failure() && steps.snapshots.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: www-snapshots
          path: www/tests/*-snapshots/
