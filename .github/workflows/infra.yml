name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/**/*.md"
      - ".github/workflows/infra.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Test nginx config
        run: |
          set -euo pipefail
          image=$(docker compose -f infra/docker-compose.yml config --images)
          certs=$(mktemp -d)
          for domain in nii.au when.party; do
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$domain" \
              -keyout "$certs/$domain.key" -out "$certs/$domain.crt" 2>/dev/null
          done
          docker run --rm \
            -v "$PWD/infra/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$certs:/etc/nginx/certs:ro" \
            "$image" nginx -t

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          source: "infra/docker-compose.yml,infra/nginx/conf.d,infra/scripts"
          target: "/opt/services/whenparty/infra/"
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd /opt/services/whenparty/infra
            docker network inspect wp_www >/dev/null 2>&1 || docker network create wp_www
            docker network inspect wp_tempsites >/dev/null 2>&1 || docker network create wp_tempsites
            chmod +x scripts/*.sh
            docker compose pull
            docker compose up -d
            grep -qs '^set_real_ip_from' nginx/conf.d/cloudflare_real_ip.conf || ./scripts/update-cloudflare-real-ip.sh
            docker exec nginx nginx -t
            docker exec nginx nginx -s reload
            CF_IP_SCRIPT=/opt/services/whenparty/infra/scripts/update-cloudflare-real-ip.sh
            { crontab -l 2>/dev/null | grep -vF "$CF_IP_SCRIPT" || true; echo "0 * * * * $CF_IP_SCRIPT >/tmp/update-cloudflare-real-ip.log 2>&1"; } | crontab -
