name: games-index

services:
  app:
    image: ${IMAGE:-ghcr.io/whenparty/index:latest}
    container_name: index
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.index.rule=Host(`games.when.party`)'
      - 'traefik.http.routers.index.entrypoints=web'
      - 'traefik.http.services.index.loadbalancer.server.port=80'
    networks:
      - wp_tempsites

networks:
  wp_tempsites:
    external: true
