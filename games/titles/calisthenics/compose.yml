name: games-calisthenics

services:
  app:
    image: ${IMAGE:-ghcr.io/whenparty/calisthenics:latest}
    container_name: calisthenics
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.calisthenics.rule=Host(`calisthenics.when.party`)'
      - 'traefik.http.routers.calisthenics.entrypoints=web'
      - 'traefik.http.services.calisthenics.loadbalancer.server.port=80'
    networks:
      - wp_tempsites

networks:
  wp_tempsites:
    external: true
