<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic-tac-toe · When Party</title>
    <link rel="icon" href="/src/assets/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main>
      <h1>Tic-tac-toe</h1>

      <section id="lobby" hidden>
        <button id="create" type="button">Start a game</button>
        <form id="join">
          <label for="code">Or enter one with its code</label>
          <div class="row">
            <input
              id="code"
              name="code"
              placeholder="K7MXQ"
              maxlength="9"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
            />
            <button type="submit">Enter</button>
          </div>
          <p id="join-error" class="error" role="alert"></p>
        </form>
      </section>

      <section id="game" hidden>
        <p class="room">
          <span id="code-line" hidden>
            Room <strong id="room-code"></strong>
            <button id="copy-link" type="button">Copy invite link</button>
          </span>
          <span id="host-badge" hidden>you host</span>
        </p>
        <p id="status" aria-live="polite"></p>
        <div id="board"></div>
        <div id="requests"></div>
        <div class="row">
          <button id="next-match" type="button" hidden>Start the next match</button>
          <button id="leave" type="button">Leave</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
