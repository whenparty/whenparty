name: games-signaling

services:
  app:
    image: ${IMAGE:-ghcr.io/whenparty/signaling:latest}
    container_name: signaling
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Written to .env by the deploy from the TURN_SECRET repository secret. Without it,
      # /turn-credentials is a 404 and the games connect without TURN.
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: turn:turn.when.party:3478?transport=udp,turn:turn.when.party:3478?transport=tcp
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.signaling.rule=Host(`signaling.when.party`)'
      - 'traefik.http.routers.signaling.entrypoints=web'
      - 'traefik.http.services.signaling.loadbalancer.server.port=8080'
    networks:
      - wp_tempsites

networks:
  wp_tempsites:
    external: true
