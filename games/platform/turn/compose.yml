name: games-turn

# coturn for the P2P games (see AGENTS.md). It listens on the host's network: relaying needs a
# port per allocation, and publishing a range of ports through Docker is slow and hides the
# clients' real addresses. The firewall opens 3478/udp, 3478/tcp and 49152-49407/udp.
services:
  app:
    image: coturn/coturn:4.18.0-alpine
    container_name: turn
    restart: unless-stopped
    network_mode: host
    entrypoint: ['/bin/sh', '/etc/coturn/start.sh']
    environment:
      # Written to .env by the deploy from the TURN_SECRET repository secret
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./start.sh:/etc/coturn/start.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    cap_drop:
      - ALL
    # The image's turnserver binary carries this file capability, and the kernel refuses to run it
    # without it in the bounding set. It only allows ports below 1024.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'turnutils_stunclient', '127.0.0.1']
      interval: 30s
      timeout: 3s
      retries: 3
