name: games-turn

services:
  app:
    image: coturn/coturn:4.19.0-alpine
    container_name: turn
    restart: unless-stopped
    network_mode: host
    entrypoint: ['/bin/sh', '/etc/coturn/start.sh']
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./start.sh:/etc/coturn/start.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'turnutils_stunclient', '127.0.0.1']
      interval: 30s
      timeout: 3s
      retries: 3
