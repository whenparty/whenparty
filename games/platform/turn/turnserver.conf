# coturn for the P2P games on *.when.party (see README.md). start.sh adds the secret at start,
# so it is not in git.

# TURN and STUN on 3478, over UDP and TCP. No TLS yet: the game data is already encrypted end to
# end by WebRTC (DTLS), so TLS would only hide which peers talk to each other.
listening-port=3478
no-tls
pidfile=/tmp/turnserver.pid

# Relay ports, one per allocation. The firewall opens exactly this range.
min-port=49152
max-port=49407

# Short-lived credentials only (TURN REST API): the signaling server hands them out, signed with
# the secret that start.sh adds as static-auth-secret.
use-auth-secret
realm=when.party
fingerprint
stale-nonce=600

# Only what the games need: browsers relay over UDP, and game messages are small. A cap per
# session makes the server useless for relaying anything heavy, like video. With UDP relays only,
# nothing can reach a TCP service through this server: SSH, nginx, Traefik.
no-tcp-relay
max-bps=64000
bps-capacity=8000000
user-quota=32
total-quota=256

# Never relay into the networks around this server: Docker networks (signaling, Traefik and its
# dashboard), private and local ranges, and addresses that are not on the internet. Loopback is
# denied by default (allow-loopback-peers is off). This server's own public address stays allowed:
# when both players relay, each one's peer is the other's relay address on it. So no UDP service
# other than this one may listen on that address (see README.md).
# No range here may start at ::, as in ::-::ffff: coturn then matches every IPv4 peer against it
# and relays nothing (tests/smoke.sh checks a public peer is allowed).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Logs go to docker logs, without file rollover
log-file=stdout
simple-log
