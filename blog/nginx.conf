map $arg_v $blog_asset_cache_control {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location = /podcast.xml {
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|webp|avif|jpe?g|png|svg)$ {
        add_header Cache-Control $blog_asset_cache_control;
        try_files $uri =404;
    }

    location ^~ /audio/ {
        location ~ "^/audio/[a-z0-9-]+\.[0-9a-f]{8}\.mp3$" {
            if ($is_args) { return 404; }
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        return 404;
    }
}
