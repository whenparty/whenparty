upstream temp_router {
    zone temp_router 64k;
    server traefik-tempsites:8000 resolve;
    keepalive 64;
}

server {
    listen 443 ssl;
    server_name *.when.party;

    ssl_certificate /etc/nginx/certs/when.party.crt;
    ssl_certificate_key /etc/nginx/certs/when.party.key;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; frame-ancestors 'none';" always;

    include /etc/nginx/conf.d/errors/pages.inc;
    error_page 418 =404 /_errors/unknown-host.html;

    location = /_errors/unknown-host.html {
        internal;
        alias /etc/nginx/conf.d/errors/unknown-host.html;
    }

    location / {
        proxy_pass http://temp_router;
    }
}
