# *.when.party: TLS ends here, then Traefik routes each host to its project container.
# when.party and www.when.party are the When Party site (www.conf).
# Shared headers, proxy settings and rate limits come from default.conf.

upstream temp_router {
    zone temp_router 64k;
    server traefik-tempsites:8000 resolve;
    keepalive 64;
}

# The signaling server of the P2P games (games/platform/signaling) gets its own per-IP limits.
# Every player holds one WebSocket there, and the players of one party often share an IP (one
# Wi-Fi, or a mobile carrier's NAT), so the 15 connections every other site allows would shut the
# 16th player out. Separate zones also keep those sockets from using up the 15 that the game pages
# get. The server limits what each socket does (games/platform/signaling/AGENTS.md).
limit_conn_zone $binary_remote_addr zone=signaling_conn:10m;
limit_req_zone $binary_remote_addr zone=signaling_req:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name signaling.when.party;

    ssl_certificate /etc/nginx/certs/when.party.crt;
    ssl_certificate_key /etc/nginx/certs/when.party.key;

    # These replace the limits from default.conf for this server
    limit_conn signaling_conn 64;
    limit_req zone=signaling_req burst=100 nodelay;

    location / {
        proxy_pass http://temp_router;
    }
}

server {
    listen 443 ssl;
    server_name *.when.party;

    ssl_certificate /etc/nginx/certs/when.party.crt;
    ssl_certificate_key /etc/nginx/certs/when.party.key;

    # Relaxed CSP: temp sites may rely on inline scripts and styles.
    # script-src allows the Cloudflare Web Analytics beacon that Cloudflare injects into every page.
    # It reports to /cdn-cgi/rum on the site itself, which 'self' covers.
    # connect-src lets P2P games reach the Trystero signaling server (games/platform/signaling),
    # over WebSocket and for their TURN credentials.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://signaling.when.party https://signaling.when.party; frame-ancestors 'none';" always;

    location / {
        proxy_pass http://temp_router;
    }
}
