# *.when.party: TLS ends here, then Traefik routes each host to its project container.
# when.party and www.when.party are the When Party site (www.conf).
# Shared headers, proxy settings and rate limits come from default.conf.

upstream temp_router {
    zone temp_router 64k;
    server traefik-tempsites:8000 resolve;
    keepalive 64;
}

server {
    listen 443 ssl;
    server_name *.when.party;

    ssl_certificate /etc/nginx/certs/when.party.crt;
    ssl_certificate_key /etc/nginx/certs/when.party.key;

    # Relaxed CSP: temp sites may rely on inline scripts and styles.
    # connect-src lets P2P games reach the Trystero signaling relay (temp-sites/projects/relay).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://relay.when.party; frame-ancestors 'none';" always;

    location / {
        proxy_pass http://temp_router;
    }
}
