# www.nii.au, plus the nii.au → www.nii.au redirect.
# Shared headers, proxy settings and rate limits come from default.conf.

upstream nii_au_backend {
    zone nii_au_backend 64k;
    server nii-au:80 resolve;
}

server {
    listen 443 ssl;
    server_name www.nii.au;

    ssl_certificate /etc/nginx/certs/nii.au.crt;
    ssl_certificate_key /etc/nginx/certs/nii.au.key;

    # Allow the Cloudflare analytics beacon while keeping other resources scoped tightly.
    # media-src blob: is for the scroll video, which script.js plays from an in-memory Blob.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self'; media-src 'self' blob:; connect-src 'self' https://static.cloudflareinsights.com; frame-ancestors 'self';" always;

    location / {
        proxy_pass http://nii_au_backend;
    }
}

server {
    listen 443 ssl;
    server_name nii.au;

    ssl_certificate /etc/nginx/certs/nii.au.crt;
    ssl_certificate_key /etc/nginx/certs/nii.au.key;

    return 301 https://www.nii.au$request_uri;
}
